<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Card Collection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .card {
      perspective: 1200px;
    }

    .inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .8s;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
    }

    .card.flipped .inner {
      transform: rotateY(180deg);
    }

    .front,
    .back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .front {
      z-index: 2;
      transform: rotateY(0deg);
    }

    .back {
      transform: rotateY(180deg);
    }

    /* Much slower blur and fade transition for the first 3 items */
    .value {
      filter: blur(0);
      opacity: 1;
      letter-spacing: 0;
      transition: filter 20s ease, opacity 20s ease, letter-spacing 20s ease;
    }

    .card.flipped .value {
      filter: blur(10px);
      opacity: 0;
      letter-spacing: 0.55em;
    }

    /* Memory blur effect triggered upon scrolling past, with a slow transition */
    .card.memory-blur .front,
    .card.memory-blur .back {
      filter: blur(2px);
      transition: filter 6s ease;
    }

    .survives {
      filter: none;
      opacity: 1;
    }

    .value-slot {
      overflow: hidden;
      min-height: 1.5em;
    }

    /* The 4th item (last-to-go) retains a delayed, staggered transition */
    .value.last-to-go {
      transition: filter 5s linear 15s, opacity 5s linear 15s, letter-spacing 5s linear 15s;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center p-8">

  <!-- Horizontally scrollable container for 20 cards -->
  <div id="cards" class="w-full flex flex-row flex-nowrap items-stretch justify-start gap-6 overflow-x-auto pb-6 px-4"></div>

  <template id="card-template">
    <div class="w-[360px] min-w-[360px] shrink-0 flex flex-col items-center">
      <!-- Date label on top of each card -->
      <div class="card-date font-mono text-xs font-semibold text-stone-500 mb-3 tracking-[0.2em] uppercase"></div>
      
      <div class="card w-full h-[520px] transition-all duration-700">
        <div class="inner">

          <!-- Front face -->
          <div class="front bg-white rounded-3xl shadow-xl shadow-slate-200/60 p-6 flex flex-col justify-between border border-slate-200/80 transition-all duration-700">
            <div class="flex flex-col h-full justify-between">
              <div class="flex flex-col items-center">
                <div class="front-media w-full h-60 rounded-2xl overflow-hidden bg-slate-100"></div>

                <h2 class="front-title text-xl font-bold text-slate-800 mt-6 tracking-tight text-center truncate w-full"></h2>
                <p class="front-place text-sm font-normal text-slate-500 mt-1 text-center truncate w-full"></p>
              </div>

              <div class="w-full mt-4">
                <button type="button" class="archive-btn w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-xl transition-all duration-200 shadow-md hover:shadow-lg active:scale-[0.99] flex items-center justify-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                  </svg>
                  <span>Archive this</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Back face: archival specimen label -->
          <div class="back bg-[#f7f4ee] rounded-3xl shadow-xl shadow-slate-200/60 p-6 transition-all duration-700">
            <div class="survives h-full box-border border border-stone-400/80 px-5 py-6 flex flex-col font-mono text-stone-800">
              <p class="survives text-[11px] tracking-[0.28em] uppercase text-stone-500">Catalog</p>
              <p class="survives catalog-id text-lg tracking-[0.18em] mt-1">REC-000</p>

              <div class="mt-6 space-y-5 text-[13px] leading-relaxed">
                <div>
                  <p class="survives text-[10px] tracking-[0.22em] uppercase text-stone-500">Title</p>
                  <div class="value-slot mt-1">
                    <p class="value field-title">Specimen title (placeholder)</p>
                  </div>
                </div>
                <div>
                  <p class="survives text-[10px] tracking-[0.22em] uppercase text-stone-500">Date and place</p>
                  <div class="value-slot mt-1">
                    <p class="value field-date-place">0000-00-00 · place unknown</p>
                  </div>
                </div>
                <div>
                  <p class="survives text-[10px] tracking-[0.22em] uppercase text-stone-500">Recorded by</p>
                  <div class="value-slot mt-1">
                    <p class="value field-recorder">Recorder name</p>
                  </div>
                </div>
                <div>
                  <p class="survives text-[10px] tracking-[0.22em] uppercase text-stone-500">What was not captured</p>
                  <div class="value-slot mt-1">
                    <p class="value last-to-go field-not-captured">A note of what this record fails to hold.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </template>

  <script>
    function renderMedia(container, record) {
      container.replaceChildren();

      if (record.type === 'image') {
        const img = document.createElement('img');
        img.src = record.file;
        img.alt = record.title;
        img.className = 'w-full h-full object-cover';
        container.appendChild(img);
        return;
      }

      if (record.type === 'sound') {
        container.classList.add('flex', 'items-center', 'justify-center', 'p-4');
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = record.file;
        audio.className = 'w-full';
        container.appendChild(audio);
        return;
      }

      if (record.type === 'text') {
        container.classList.add('p-4', 'overflow-y-auto');
        const pre = document.createElement('p');
        pre.className = 'text-sm text-slate-600 whitespace-pre-wrap leading-relaxed';
        pre.textContent = record.title;
        container.appendChild(pre);
      }
    }

    function fillCard(cardEl, record) {
      cardEl.querySelector('.card-date').textContent = record.date;
      cardEl.querySelector('.catalog-id').textContent = record.id;
      cardEl.querySelector('.field-title').textContent = record.title;
      cardEl.querySelector('.field-date-place').textContent = record.date + ' · ' + record.place;
      cardEl.querySelector('.field-recorder').textContent = record.recorder;
      cardEl.querySelector('.field-not-captured').textContent = record.not_captured;
      cardEl.querySelector('.front-title').textContent = record.title;
      cardEl.querySelector('.front-place').textContent = record.place;
      renderMedia(cardEl.querySelector('.front-media'), record);

      const archiveBtn = cardEl.querySelector('.archive-btn');
      archiveBtn.addEventListener('click', function () {
        const cardNode = cardEl.querySelector('.card');
        cardNode.classList.add('flipped');
      });
    }

    fetch('records.json')
      .then(function (response) {
        if (!response.ok) throw new Error('Could not load records.json');
        return response.json();
      })
      .then(function (data) {
        let records = data.records || [];
        
        // Ensure we always have 20 records
        for (let i = records.length + 1; i <= 20; i++) {
          const idStr = 'REC-' + String(i).padStart(3, '0');
          records.push({
            id: idStr,
            title: 'Specimen Title ' + i,
            type: 'text',
            file: 'media/description.txt',
            date: '2026-08-' + (10 + (i % 20)),
            place: 'Placeholder Location ' + i,
            recorder: 'Echo',
            not_captured: 'unrecorded sensory detail ' + i,
            certainty: 3
          });
        }

        const template = document.getElementById('card-template');
        const cardsRoot = document.getElementById('cards');

        records.slice(0, 20).forEach(function (record) {
          const cardEl = template.content.firstElementChild.cloneNode(true);
          fillCard(cardEl, record);
          cardsRoot.appendChild(cardEl);
        });

        // Scroll blur / memory decay behavior: blur only cards scrolled past, keeping blur permanently
        cardsRoot.addEventListener('scroll', function () {
          const scrollLeft = cardsRoot.scrollLeft;
          const cardWrappers = cardsRoot.querySelectorAll(':scope > div');

          cardWrappers.forEach(function (wrapper) {
            const card = wrapper.querySelector('.card');
            const cardRight = wrapper.offsetLeft + wrapper.offsetWidth;
            // Check if card has scrolled past the left viewport boundary
            if (cardRight < scrollLeft + 50) {
              card.classList.add('memory-blur');
            }
          });
        });
      })
      .catch(function (err) {
        console.error(err);
      });
  </script>

</body>
</html>
